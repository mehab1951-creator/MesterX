<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUREO Solver - منصة واحدة. كل الكورسات.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0e17;
            font-family: 'Tajawal', sans-serif;
            color: #f1f5f9;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .terminal-scroll::-webkit-scrollbar { width: 5px; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="p-3 md:p-6 min-h-screen flex flex-col justify-between max-w-xl mx-auto space-y-6">

    <!-- Top Bar -->
    <header class="flex justify-between items-center py-2">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-600/40">
                Q
            </div>
            <div class="flex items-center gap-1.5 font-bold tracking-wider text-sm">
                <span class="text-white">QUREO</span>
                <span class="text-indigo-400 text-xs">SOLVER</span>
            </div>
        </div>
        <a href="https://t.me/" target="_blank" class="flex items-center gap-1.5 bg-slate-900 border border-slate-800 hover:border-slate-700 px-3 py-1.5 rounded-full text-xs text-slate-300 transition">
            <svg class="w-3.5 h-3.5 fill-current text-sky-400" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.38-.27-2.06-.49-.83-.27-1.49-.42-1.43-.88.03-.24.37-.49 1.02-.74 4-1.74 6.67-2.89 8.02-3.46 3.82-1.6 4.62-1.88 5.14-1.89.11 0 .37.03.54.17.14.12.18.28.2.45-.02.07-.02.21-.04.35z"/></svg>
            <span>Telegram</span>
        </a>
    </header>

    <!-- Hero Title -->
    <section class="text-center space-y-2 pt-2">
        <p class="text-xs font-semibold text-indigo-400 tracking-wide">— منصة واحدة. كل الكورسات.</p>
        <h1 class="text-3xl md:text-4xl font-extrabold text-white leading-tight">
            اختارها. حلها.<br>وتقدّم للأمام.
        </h1>
        <p class="text-xs text-slate-400 max-w-sm mx-auto leading-relaxed">
            حل سريع ودقيق للكورسات مع نشاط مباشر خاص بكل جلسة. من غير زحمة — بس الكورسات المناسبة لسنتك.
        </p>

        <!-- Feature Pills -->
        <div class="flex justify-center gap-2 pt-2 text-[11px] text-slate-300">
            <span class="bg-slate-900 border border-slate-800 px-3 py-1 rounded-full">30 حل نشط</span>
            <span class="bg-slate-900 border border-slate-800 px-3 py-1 rounded-full">طابور ذكي</span>
            <span class="bg-slate-900 border border-slate-800 px-3 py-1 rounded-full">تقدم مباشر</span>
        </div>
    </section>

    <!-- SECTION 1: Step-by-Step Wizard Form -->
    <div id="wizardCard" class="bg-[#101424] border border-slate-800/80 rounded-2xl p-5 shadow-2xl relative overflow-hidden">
        
        <div class="flex justify-between items-center mb-4">
            <div>
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <span class="text-xs bg-indigo-900/60 text-indigo-400 px-2 py-0.5 rounded font-mono">01</span>
                    <span>ابدأ حل جديد</span>
                </h2>
                <p class="text-[11px] text-slate-400 mt-0.5">أربع خطوات سريعة. والباقي علينا.</p>
            </div>
            <span id="stepIndicator" class="text-xs font-medium text-slate-400 bg-slate-900 px-2.5 py-1 rounded-full border border-slate-800">
                الخطوة 1 من 4
            </span>
        </div>

        <form id="solverForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
            
            <!-- STEP 1: Grade Selection -->
            <div id="step1" class="step-pane space-y-2">
                <label class="block text-xs font-medium text-slate-300">اختر الصف الدراسي</label>
                <div class="grid grid-cols-1 gap-2">
                    <button type="button" onclick="selectGrade('grade_1')" class="grade-btn w-full text-right p-3 rounded-xl bg-slate-950 border border-slate-800 hover:border-indigo-500 text-sm font-semibold transition">
                        أولى بكالوريا
                    </button>
                    <button type="button" onclick="selectGrade('grade_2')" class="grade-btn w-full text-right p-3 rounded-xl bg-slate-950 border border-slate-800 hover:border-indigo-500 text-sm font-semibold transition">
                        تانية بكالوريا
                    </button>
                    <button type="button" onclick="selectGrade('languages')" class="grade-btn w-full text-right p-3 rounded-xl bg-slate-95
